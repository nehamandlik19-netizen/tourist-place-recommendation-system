<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TravelMate | Login</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body class="auth-background">


<header class="top-header">

    <div class="header-container">

        <a href="../index.html" class="brand">

            <span class="brand-icon">
                ✈
            </span>

            TravelMate

        </a>

        <a
            href="../index.html"
            class="header-link"
        >
            ← Home
        </a>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            ✈️
        </div>

        <span class="eyebrow">
            WELCOME BACK
        </span>

        <h1>
            Login to TravelMate
        </h1>

        <p>
            Continue discovering your perfect destinations.
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button full-button"
            >
                Login
            </button>


            <p
                id="loginMessage"
                class="form-message"
            ></p>

        </form>


        <p class="auth-footer-text">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>

</main>


<script
    type="module"
    src="../js/auth.js"
></script>

</body>

</html>
