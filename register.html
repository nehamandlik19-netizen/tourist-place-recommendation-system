<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TravelMate | Register</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body class="auth-background">


<header class="top-header">

    <div class="header-container">

        <a href="../index.html" class="brand">

            <span class="brand-icon">
                ✈
            </span>

            TravelMate

        </a>

        <a
            href="../index.html"
            class="header-link"
        >
            ← Home
        </a>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🌍
        </div>

        <span class="eyebrow">
            START YOUR JOURNEY
        </span>

        <h1>
            Create Your Account
        </h1>

        <p>
            Join TravelMate and discover amazing destinations.
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button full-button"
            >
                Create Account
            </button>


            <p
                id="registerMessage"
                class="form-message"
            ></p>

        </form>


        <p class="auth-footer-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</main>


<script
    type="module"
    src="../js/auth.js"
></script>

</body>

</html>
